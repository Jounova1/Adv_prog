<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Job Details</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="navbar">
    <h2>JobLink</h2>

    <div>
        <a href="/home">Home</a>
        <a href="/jobs">Jobs</a>
    </div>
</div>

<div class="container">

<div class="card">

    <h1 th:text="${job.title}"></h1>

    <p><b>Company:</b> <span th:text="${job.company}"></span></p>
    <p><b>Category:</b> <span th:text="${job.category}"></span></p>
    <p><b>Location:</b> <span th:text="${job.location}"></span></p>
    <p><b>Type:</b> <span th:text="${job.type}"></span></p>
    <p><b>Salary:</b> <span th:text="${job.salary}"></span></p>

    <h3>Description</h3>
    <p th:text="${job.description}"></p>

    <a href="/jobs">← Back to Jobs</a>

</div>

</div>

<div class="footer">
    <p>© 2026 JobLink</p>
</div>

</body>
</html>
