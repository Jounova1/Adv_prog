<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile - JobLink</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>JobLink</h2>
    <div>
        <a href="home.html">Home</a>
        <a href="jobs.html">Jobs</a>
        <a href="login.html">Logout</a>
    </div>
</div>

<div class="container">

    <!-- PROFILE HEADER -->
    <div class="profile-header">

        <div class="profile-avatar">
            <span th:text="${#strings.substring(user.name,0,1)}">U</span>
        </div>

        <div class="profile-info">
            <h1 th:text="${user.name}">User Name</h1>
            <p th:text="${user.email}">user@email.com</p>
            <p class="role">Job Seeker</p>
        </div>

    </div>

    <!-- STATS -->
    <div class="profile-stats">

        <div class="stat-card">
            <h3 th:text="${applications.size()}">0</h3>
            <p>Applications</p>
        </div>

        <div class="stat-card">
            <h3>Active</h3>
            <p>Status</p>
        </div>

        <div class="stat-card">
            <h3>Premium</h3>
            <p>Account</p>
        </div>

    </div>

    <!-- APPLICATIONS -->
    <h2>My Applications</h2>

    <div th:if="${applications.isEmpty()}">
        <div class="card">
            <p>No applications yet. Start applying for jobs!</p>
        </div>
    </div>

    <div th:each="app : ${applications}" class="card application-card">

        <h3 th:text="${app.job.title}">Job Title</h3>
        <p><b>Company:</b> <span th:text="${app.job.company}"></span></p>
        <p><b>Status:</b>
            <span class="status" th:text="${app.status}">Pending</span>
        </p>

        <a th:href="@{'/job/' + ${app.job.id}}">View Job</a>

    </div>

</div>

</body>
</html>
